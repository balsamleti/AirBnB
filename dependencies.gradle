dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webflux'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb-reactive'
    implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:+'
    implementation 'io.github.cdimascio:openapi-spring-webflux-validator:4.2.+'
    implementation 'io.swagger.parser.v3:swagger-parser-v3:+'
    implementation 'io.swagger.core.v3:swagger-models-jakarta:+'
    implementation 'org.springframework.cloud:spring-cloud-starter-config:+'
    implementation 'org.springframework.cloud:spring-cloud-config-client:+'
    implementation 'org.springframework.cloud:spring-cloud-starter-bootstrap:+'
    implementation 'org.projectlombok:lombok:+'
    annotationProcessor 'org.projectlombok:lombok:+'
    implementation 'org.mapstruct:mapstruct:+'
    annotationProcessor 'org.mapstruct:mapstruct-processor:+'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'io.projectreactor:reactor-test'

    implementation('com.github.mongobee:mongobee:0.13') {
        exclude group: 'org.mongodb'
    }
}