openapi: 3.0.3
info:
  title: AirBnB Backend Service
  description: APIs for managing user profile, guests, and bookings
  version: 1.0.0
servers:
  - url: /airbnb-manager
paths:
  /users/profile:
    post:
      summary: Create a new user
      operationId: createUser
      tags: [User]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/profile/{Id}:
    delete:
      summary: Delete user profile
      operationId: deleteUserOps
      tags: [ User ]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    get:
      summary: Get user profile
      operationId: getProfile
      tags: [User]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: User profile retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Update user profile
      operationId: updateProfile
      tags: [User]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserProfileRequest'
      responses:
        '200':
          description: User profile updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/myBookings:
    get:
      summary: Get bookings for user
      operationId: getMyBookings
      tags: [Booking]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Booking'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/guests:
    get:
      summary: Get all guests
      operationId: getGuests
      tags: [Guest]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
      responses:
        '200':
          description: Guest list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Guest'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Add guest
      operationId: addGuest
      tags: [Guest]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guest'
      responses:
        '201':
          description: Guest added
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /users/guests/{guestId}:
    put:
      summary: Update guest
      operationId: updateGuest
      tags: [Guest]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
        - $ref: '#/components/parameters/GuestId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Guest'
      responses:
        '200':
          description: Guest updated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      summary: Delete guest
      operationId: deleteGuest
      tags: [Guest]
      parameters:
        - $ref: '#/components/parameters/UUID'
        - $ref: '#/components/parameters/Channel'
        - $ref: '#/components/parameters/XApplication'
        - $ref: '#/components/parameters/GuestId'
      responses:
        '204':
          description: Guest deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
components:
  parameters:
    UUID:
      name: UUID
      in: header
      required: true
      description: Unique request identifier
      schema:
        type: string
    Channel:
      name: channel
      in: header
      required: true
      description: Request source channel
      schema:
        type: string
        enum: [web, mobile]
    XApplication:
      name: XApplication
      in: header
      required: true
      description: Calling application name
      schema:
        type: string
        maxLength: 50
    Id:
      name: Id
      in: path
      required: true
      schema:
        type: string
        format: 20
    GuestId:
      name: guestId
      in: path
      required: true
      schema:
        type: string
        format: 20
  schemas:
    ApiError:
      type: object
      properties:
        status:
          type: integer
          format: int32
          example: 400
        message:
          type: string
          example: Invalid request
      required: [status, message]
    CreateUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        dateOfBirth:
          type: string
        contactNumber:
          type: string
      required: [email, name, gender, contactNumber]
    UpdateUserProfileRequest:
      type: object
      properties:
        name:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        dateOfBirth:
          type: string
          format: date
    User:
      type: object
      properties:
        email:
          type: string
          format: email
        name:
          type: string
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
        dateOfBirth:
          type: string
          format: date
        contactNumber:
          type: string
    Guest:
      type: object
      properties:
        name:
          type: string
        age:
          type: integer
        gender:
          type: string
          enum: [MALE, FEMALE, OTHER]
      required: [name, gender]
    Booking:
      type: object
      properties:
        id:
          type: integer
          format: int64
        roomsCount:
          type: integer
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        bookingStatus:
          type: string
          enum: [CREATED, CONFIRMED, CANCELLED]
        amount:
          type: number
          format: decimal
        guests:
          type: array
          items:
            $ref: '#/components/schemas/Guest'
  responses:
    BadRequest:
      description: Bad Request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InternalServerError:
      description: Internal Server Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'