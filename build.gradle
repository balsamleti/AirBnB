buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.jsonschema2pojo:jsonschema2pojo-gradle-plugin:latest.integration'
    }
}

plugins {
    id 'java'
    id 'org.springframework.boot' version '3.4.0'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.airbnb.be'
version = 'airBnb-manager-webflux-00001'

apply from: 'dependencies.gradle'
apply plugin: 'jsonschema2pojo'

repositories {
    mavenCentral()
}

jsonSchema2Pojo {
    source = files("${rootProject.projectDir}/misc/schema")
    targetDirectory = file("${rootProject.layout.buildDirectory.get()}/generated-sources/main/models")
    targetPackage = 'com.airbnb.be.generated'
    sourceType = 'jsonschema'
}

bootJar {
    enabled = false
}

jar {
    enabled = true
}